<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Starlight Kingdom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  :root {
    --night: #07071a;
    --gold: #f5d78e;
    --gold-deep: #c4930a;
    --ink: #e8dfc0;
    --ink-soft: #ddd3b0;
    --muted: #c9bc95;
    --violet: #c9b8f0;
    --shrine: #dca0f5;
    --glass: rgba(9, 8, 30, 0.72);
    --glass-line: rgba(245, 215, 142, 0.22);
    --display: 'Cinzel Decorative', Georgia, serif;
    --body: 'Crimson Pro', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--night); color: var(--ink); font-family: var(--body); overflow: hidden; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  /* ─── World layer ─────────────────────────────────────────────── */
  #world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse at 50% 40%, rgba(7,7,26,0) 55%, rgba(7,7,26,0.55) 100%); }

  /* ─── Screens ─────────────────────────────────────────────────── */
  .screen { position: fixed; inset: 0; z-index: 2; overflow-y: auto; opacity: 0; visibility: hidden;
    transition: opacity 0.6s ease, visibility 0s linear 0.6s; }
  .screen.active { opacity: 1; visibility: visible; transition: opacity 0.6s ease 0.25s, visibility 0s; }

  .icon-btn { position: fixed; top: 16px; right: 16px; z-index: 10; width: 48px; height: 48px; border-radius: 50%;
    border: 1px solid rgba(245,215,142,0.35); background: rgba(13,11,53,0.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: border-color .2s, transform .2s; }
  .icon-btn:hover { border-color: var(--gold); transform: scale(1.06); }

  /* ─── Type ────────────────────────────────────────────────────── */
  .eyebrow { font-size: 0.85rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--violet); }
  .display { font-family: var(--display); font-weight: 700; color: var(--gold); line-height: 1.05; letter-spacing: 0.02em; }
  .glow-text { animation: glow 4s ease-in-out infinite alternate; }
  @keyframes glow { from { text-shadow: 0 0 24px rgba(245,215,142,.25); } to { text-shadow: 0 0 48px rgba(245,215,142,.55), 0 0 110px rgba(196,147,10,.25); } }
  .story-text { font-size: 1.15rem; line-height: 1.75; color: var(--ink-soft); }
  .story-text em { color: var(--gold); font-style: italic; font-weight: 600; }

  /* ─── Buttons & inputs ────────────────────────────────────────── */
  .btn { height: 52px; padding: 0 28px; border-radius: 26px; border: none; background: var(--gold); color: #120c02;
    font-family: var(--display); font-weight: 700; font-size: 0.95rem; letter-spacing: 0.05em; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    cursor: pointer; box-shadow: 0 6px 30px rgba(245,215,142,0.3); transition: transform .2s, box-shadow .2s, opacity .2s; }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(245,215,142,.45); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
  .btn.violet { background: var(--shrine); box-shadow: 0 6px 30px rgba(220,160,245,0.3); }
  .btn svg { flex: none; }

  .field { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; flex: 1 1 240px; max-width: 340px; }
  .field label { font-size: 0.85rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .name-input { width: 100%; height: 52px; padding: 0 18px; border-radius: 26px; border: 1px solid rgba(245,215,142,0.4);
    background: rgba(13,11,53,0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #fff8dc; font-family: var(--body); font-size: 1.15rem; transition: border-color .2s, box-shadow .2s; }
  .name-input::placeholder { color: #8f8466; }
  .name-input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245,215,142,.25); }

  /* ─── Welcome ─────────────────────────────────────────────────── */
  .stage { min-height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center;
    padding: 9vh 16px 7vh; text-align: center; gap: 32px; }
  .stage::after { content: ''; position: fixed; left: 0; right: 0; bottom: 0; height: 46%; z-index: -1; pointer-events: none;
    background: linear-gradient(180deg, rgba(7,7,26,0) 0%, rgba(7,7,26,0.82) 55%, var(--night) 100%); }
  .stage header { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 900px; }
  .stage h1 { font-size: clamp(2.4rem, 6.4vw, 5.6rem); }
  .tagline { font-style: italic; font-size: clamp(1.1rem, 1.8vw, 1.45rem); color: var(--ink-soft); }
  .stage-bottom { display: flex; flex-direction: column; align-items: center; gap: 22px; width: 100%; max-width: 680px; }
  .form-row { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 14px; width: 100%; }

  /* ─── Character select ────────────────────────────────────────── */
  .char-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; width: 100%; max-width: 960px; }
  @media (max-width: 860px) { .char-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } }
  .char-card { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 14px 18px; border-radius: 20px; cursor: pointer; text-align: center;
    background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--glass-line);
    transition: transform .25s, border-color .25s, box-shadow .25s, background .25s; }
  .char-card:hover { transform: translateY(-4px); border-color: rgba(245,215,142,.6); }
  .char-card[aria-pressed="true"] { border-color: var(--gold); background: rgba(30,24,70,0.8); box-shadow: 0 0 0 1px var(--gold), 0 0 40px rgba(245,215,142,.25); }
  .portrait { width: 96px; height: 96px; }
  .char-name { font-family: var(--display); font-size: 0.9rem; color: var(--gold); }
  .char-desc { font-size: 0.98rem; color: var(--muted); font-style: italic; line-height: 1.35; }

  /* ─── HUD ─────────────────────────────────────────────────────── */
  .hud { position: fixed; top: 16px; left: 16px; right: 76px; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; pointer-events: none; }
  .pill { pointer-events: auto; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px 0 6px; border-radius: 24px;
    background: rgba(9,8,30,0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(245,215,142,0.2); }
  .pill.plain { padding: 0 16px; }
  .pill canvas { width: 36px; height: 36px; border-radius: 50%; background: rgba(245,215,142,0.08); }
  .pill .who { display: flex; flex-direction: column; line-height: 1.1; }
  .pill .who strong { font-family: var(--display); font-size: 0.8rem; color: var(--gold); }
  .pill .who span { font-size: 0.85rem; color: var(--muted); }
  .dots { display: flex; gap: 6px; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(245,215,142,.5); }
  .dot.done { background: var(--gold); border-color: var(--gold); }
  .dot.now { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245,215,142,.2); }
  .hud-label { font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .hearts { display: flex; gap: 4px; }
  .heart { color: var(--gold); transition: opacity .4s, transform .4s; }
  .heart.lost { opacity: 0.25; transform: scale(0.8); }
  .heart:not(.lost) { animation: beat 2.4s ease-in-out infinite; }
  @keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.14); filter: drop-shadow(0 0 6px rgba(245,215,142,.7)); } }
  @media (max-width: 600px) {
    .hud { top: 12px; left: 12px; right: 68px; gap: 6px; }
    .pill { height: 40px; gap: 8px; padding: 0 12px 0 4px; }
    .pill.plain { padding: 0 12px; }
    .pill canvas { width: 30px; height: 30px; }
    .hud .hud-label.optional { display: none; }
    .icon-btn { top: 12px; right: 12px; width: 44px; height: 44px; }
  }
  .shake { animation: shake .5s ease-in-out; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

  /* ─── Chapter title card ──────────────────────────────────────── */
  .title-card { position: fixed; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px;
    text-align: center; opacity: 0; visibility: hidden; transition: opacity .8s ease, visibility 0s linear .8s; cursor: pointer; background: none; border: none; width: 100%; }
  .title-card.on { opacity: 1; visibility: visible; transition: opacity .8s ease, visibility 0s; }
  .title-card .display { font-size: clamp(2rem, 5.5vw, 4.4rem); text-shadow: 0 0 40px rgba(7,7,26,.9), 0 0 60px rgba(245,215,142,.35); }
  .title-card .tagline { text-shadow: 0 0 20px rgba(7,7,26,1); }
  .title-card.on .display { animation: rise 1.6s ease both; }
  @keyframes rise { from { letter-spacing: 0.2em; opacity: 0; } to { letter-spacing: 0.02em; opacity: 1; } }
  .skip-hint { font-size: 0.85rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 18px; }

  /* ─── Story panel ─────────────────────────────────────────────── */
  .panel { position: fixed; z-index: 3; left: 12px; right: 12px; bottom: 12px; max-height: 60vh; overflow-y: auto;
    padding: 24px 22px; border-radius: 22px; background: var(--glass); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
    border: 1px solid var(--glass-line); box-shadow: 0 20px 60px rgba(0,0,0,.45);
    display: flex; flex-direction: column; gap: 16px; transition: opacity .5s ease, transform .5s ease; }
  .panel.hidden { opacity: 0; pointer-events: none; transform: translateY(24px); }
  .panel.violet { border-color: rgba(220,160,245,0.35); }
  @media (min-width: 1000px) {
    .panel { left: auto; right: 32px; bottom: auto; top: 50%; transform: translateY(-50%); width: min(480px, 38vw); max-height: calc(100vh - 150px); padding: 30px 30px; }
    .panel.hidden { transform: translate(24px, -50%); }
  }
  .panel h2 { font-size: 1.5rem; }
  .panel .actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 12px; padding-top: 4px; }
  .challenge-q { font-size: 1.12rem; line-height: 1.6; color: var(--ink); }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn { text-align: left; padding: 13px 16px; border-radius: 14px; border: 1px solid rgba(201,184,240,0.3); background: rgba(18,16,48,0.6);
    font-family: var(--body); font-size: 1.05rem; line-height: 1.45; color: var(--ink-soft); cursor: pointer; transition: border-color .2s, background .2s, transform .2s, color .2s; }
  .choice-btn:hover:not(:disabled) { border-color: rgba(245,215,142,.7); color: var(--gold); background: rgba(30,26,70,.6); transform: translateX(4px); }
  .choice-btn:disabled { cursor: default; }
  .choice-btn.correct { border-color: #7fd69a; background: rgba(16,48,28,.7); color: #c6f5d3; }
  .choice-btn.wrong { border-color: #e59482; background: rgba(48,16,16,.7); color: #f5cbc1; }
  .choice-btn.faded { opacity: 0.55; }
  .feedback { border-radius: 14px; padding: 14px 16px; font-size: 1.05rem; line-height: 1.6; animation: slide .35s ease-out; }
  @keyframes slide { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  .feedback.correct { background: rgba(16,48,28,.55); border: 1px solid #7fd69a; color: #d2f7dc; }
  .feedback.wrong { background: rgba(48,16,16,.55); border: 1px solid #e59482; color: #f8d6ce; }
  .feedback strong { display: block; font-family: var(--display); font-size: 0.95rem; margin-bottom: 4px; }
  .feedback .lesson { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.1); font-style: italic; color: var(--gold); }
  .lessons { display: flex; flex-direction: column; gap: 8px; }
  .lesson-pill { background: rgba(26,15,48,.6); border: 1px solid rgba(201,184,240,.3); border-radius: 12px; padding: 10px 14px; font-size: 1rem; color: var(--ink-soft); line-height: 1.4; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<canvas id="world" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<button class="icon-btn" id="sound-btn" type="button" aria-label="Turn sound on" aria-pressed="false" onclick="toggleSound()"></button>

<!-- WELCOME -->
<section class="screen active" id="screen-welcome" aria-labelledby="welcome-title">
  <div class="stage">
    <header>
      <p class="eyebrow">A tale for Anni</p>
      <h1 class="display glow-text" id="welcome-title">The Starlight Kingdom</h1>
      <p class="tagline">Beyond the Silver Mountains, where stars never sleep…</p>
    </header>
    <div class="stage-bottom">
      <p class="story-text">Tonight a shadow has stolen the <em>Crystal of Courage</em>. Without it, the stars will slowly go dark — and only one hero can bring back the light.</p>
      <form class="form-row" onsubmit="event.preventDefault(); startJourney();">
        <div class="field">
          <label for="hero-name">Your name, brave traveller</label>
          <input class="name-input" id="hero-name" type="text" placeholder="Anni" maxlength="20" autocomplete="off">
        </div>
        <button class="btn" type="submit">Begin the journey <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button>
      </form>
    </div>
  </div>
</section>

<!-- CHARACTER SELECT -->
<section class="screen" id="screen-chars" aria-labelledby="chars-title">
  <div class="stage">
    <header>
      <p class="eyebrow" id="name-greet"></p>
      <h1 class="display glow-text" id="chars-title" style="font-size: clamp(2rem, 5vw, 4rem)">Choose Your Hero</h1>
      <p class="tagline">Who will you become?</p>
    </header>
    <div class="stage-bottom" style="max-width: 960px">
      <div class="char-grid">
        <button class="char-card" type="button" aria-pressed="false" onclick="selectChar(0,this)"><canvas class="portrait" data-char="0" width="192" height="192" aria-hidden="true"></canvas><span class="char-name">The Adventurer</span><span class="char-desc">Bold, curious, and quick on their feet — ready for anything.</span></button>
        <button class="char-card" type="button" aria-pressed="false" onclick="selectChar(1,this)"><canvas class="portrait" data-char="1" width="192" height="192" aria-hidden="true"></canvas><span class="char-name">The Wizard</span><span class="char-desc">Sharp-minded and inventive — solves problems with clever thinking.</span></button>
        <button class="char-card" type="button" aria-pressed="false" onclick="selectChar(2,this)"><canvas class="portrait" data-char="2" width="192" height="192" aria-hidden="true"></canvas><span class="char-name">The Princess</span><span class="char-desc">Brave, kind, and fiercely determined — a true leader at heart.</span></button>
        <button class="char-card" type="button" aria-pressed="false" onclick="selectChar(3,this)"><canvas class="portrait" data-char="3" width="192" height="192" aria-hidden="true"></canvas><span class="char-name">The Fox Spirit</span><span class="char-desc">Wise, playful, and never gives up — even when the path is unclear.</span></button>
      </div>
      <button class="btn" id="choose-btn" type="button" disabled onclick="goToAdventure()">Begin the adventure <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button>
    </div>
  </div>
</section>

<!-- ADVENTURE -->
<section class="screen" id="screen-adventure" aria-label="Adventure">
  <div class="hud" id="hud"></div>
  <button class="title-card" id="title-card" type="button" onclick="endTitleCard()"></button>
  <aside class="panel hidden" id="adv-panel" aria-live="polite"></aside>
</section>

<!-- SHRINE OF RESILIENCE -->
<section class="screen" id="screen-shrine" aria-label="Shrine of Resilience">
  <aside class="panel violet" id="shrine-panel" aria-live="polite"></aside>
</section>

<!-- END -->
<section class="screen" id="screen-end" aria-label="Quest complete">
  <aside class="panel" id="end-panel"></aside>
</section>

<script>
// ─── AUDIO ENGINE ──────────────────────────────────────────────────────────────
let audioCtx = null, soundOn = false, activeOscillators = [], ambientMaster = null, activeChimeTimeout = null, currentAmbient = null;

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

const ICON_SOUND_ON = '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const ICON_SOUND_OFF = '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>';

function renderSoundBtn() {
  const b = document.getElementById('sound-btn');
  b.innerHTML = soundOn ? ICON_SOUND_ON : ICON_SOUND_OFF;
  b.setAttribute('aria-pressed', String(soundOn));
  b.setAttribute('aria-label', soundOn ? 'Turn sound off' : 'Turn sound on');
}

function toggleSound() {
  soundOn = !soundOn;
  renderSoundBtn();
  if (soundOn) {
    getCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    currentAmbient = null;
    playAmbient(ambientFor(scene.next ? scene.next.type : scene.type));
    startChimeLoops();
  } else {
    stopAmbient();
    currentAmbient = null;
    if (activeChimeTimeout) { clearTimeout(activeChimeTimeout); activeChimeTimeout = null; }
  }
}

function stopAmbient() {
  if (ambientMaster && audioCtx) {
    const now = audioCtx.currentTime;
    try {
      ambientMaster.gain.cancelScheduledValues(now);
      ambientMaster.gain.setValueAtTime(ambientMaster.gain.value, now);
      ambientMaster.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
    } catch(e) {}
  }
  const oscsToStop = activeOscillators;
  activeOscillators = [];
  setTimeout(() => { oscsToStop.forEach(osc => { try { osc.stop(); } catch(e) {} }); }, 1200);
}

function playAmbient(type) {
  if (!soundOn || type === currentAmbient) return;
  currentAmbient = type;
  stopAmbient();
  const ctx = getCtx();
  if (ctx.state === 'suspended') ctx.resume();
  setTimeout(() => {
    if (!soundOn) return;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(800, ctx.currentTime);
    filter.connect(ctx.destination);
    ambientMaster = ctx.createGain();
    ambientMaster.gain.setValueAtTime(0.0001, ctx.currentTime);
    ambientMaster.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 2.0);
    ambientMaster.connect(filter);
    const configs = {
      welcome: [ {f:220,t:'sine',g:0.3}, {f:330,t:'sine',g:0.15}, {f:440,t:'triangle',g:0.1}, {f:550,t:'sine',g:0.08} ],
      forest:  [ {f:180,t:'sine',g:0.25}, {f:270,t:'sine',g:0.12}, {f:360,t:'triangle',g:0.08} ],
      lake:    [ {f:196,t:'sine',g:0.28}, {f:294,t:'sine',g:0.14}, {f:392,t:'sine',g:0.09}, {f:523,t:'sine',g:0.05} ],
      mountain:[ {f:110,t:'sawtooth',g:0.08}, {f:165,t:'sine',g:0.18}, {f:220,t:'triangle',g:0.1} ],
      hall:    [ {f:261,t:'sine',g:0.2}, {f:392,t:'sine',g:0.12}, {f:523,t:'sine',g:0.08}, {f:659,t:'sine',g:0.05} ],
      shrine:  [ {f:174.6,t:'sine',g:0.24}, {f:261.6,t:'sine',g:0.12}, {f:349.2,t:'triangle',g:0.07} ],
      end:     [ {f:261,t:'sine',g:0.22}, {f:329,t:'sine',g:0.14}, {f:392,t:'sine',g:0.1}, {f:523,t:'sine',g:0.07}, {f:659,t:'sine',g:0.04} ]
    };
    const waves = configs[type] || configs.welcome;
    waves.forEach(w => {
      const osc = ctx.createOscillator(), g = ctx.createGain(), lfo = ctx.createOscillator(), lfoGain = ctx.createGain();
      osc.type = w.t; osc.frequency.value = w.f;
      lfo.frequency.value = 0.1 + Math.random() * 0.15;
      lfoGain.gain.value = w.f * 0.004;
      lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
      g.gain.value = w.g;
      osc.connect(g); g.connect(ambientMaster);
      lfo.start(); osc.start();
      activeOscillators.push(osc, lfo);
    });
  }, 100);
}

function startChimeLoops() {
  if (activeChimeTimeout) clearTimeout(activeChimeTimeout);
  function chime() {
    if (!soundOn) return;
    const ctx = getCtx();
    if (ctx.state === 'suspended') ctx.resume();
    const freqs = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
    const f = freqs[Math.floor(Math.random() * freqs.length)];
    const o = ctx.createOscillator(), g2 = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f;

function setScene(type, opts = {}) {

function initScene(type) {

  const n = type === 'forest' ? 70 : type === 'hall' ? 150 : 200;

  drawFx(dt);

  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (scene.type === 'chars') { c.fillStyle = 'rgba(7,7,26,0.25)'; c.fillRect(0, 0, cw, ch); }
  if (scene.flash > 0) { scene.flash = Math.max(0, scene.flash - dt * 0.6); c.fillStyle = `rgba(255,240,200,${scene.flash * 0.5})`; c.fillRect(0, 0, cw, ch); }
  if (scene.dim > 0) { scene.dim = Math.max(0, scene.dim - dt * 0.5); c.fillStyle = `rgba(20,0,10,${scene.dim})`; c.fillRect(0, 0, cw, ch); }
  if (scene.veil > 0) { c.fillStyle = `rgba(7,7,26,${scene.veil})`; c.fillRect(0, 0, cw, ch); }

  drawPortraits(t);
  requestAnimationFrame(frame);
}
function drawPortraits(t) {
  const active = document.querySelector('.screen.active');
  if (!active) return;
  active.querySelectorAll('canvas.portrait, canvas.mini').forEach(pc => {
    const idx = Number(pc.dataset.char);
    if (Number.isNaN(idx)) return;
    const p = pc.getContext('2d'), W = pc.width, H = pc.height, k = W / 192;
    p.setTransform(1, 0, 0, 1, 0, 0); p.clearRect(0, 0, W, H);
    const g = p.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W / 2);
    g.addColorStop(0, 'rgba(245,215,142,0.22)'); g.addColorStop(1, 'rgba(245,215,142,0)');
    p.fillStyle = g; p.fillRect(0, 0, W, H);
    p.translate(W / 2, H * 0.54); p.scale(3.5 * k, 3.5 * k);
    drawCharacter(p, idx, 0, 0, 1, t * 60);
  });
}

    correctFeedback:'The Crystal blazes with brilliant light! The hall fills with starlight, the shadow dissolves, and every star ignites with colour. You did it — not through magic, but through the power of your own belief.',
    wrongFeedback:'The Crystal flickers faintly. It has been waiting for you — but it needs your full belief. Speak from the deepest part of your heart. You\'ve come so far.',

let heroName = '', selectedChar = null, currentChapter = 0, starsEarned = 0, lessonsLearned = [], answered = false, starlightHearts = 3, activeChapterBackup = 0, titleTimer = null;
const charInfo = [{ name: 'The Adventurer' }, { name: 'The Wizard' }, { name: 'The Princess' }, { name: 'The Fox Spirit' }];

const shrineQuestions = [
  {
    q: "You face a barrier of thick shadows, and your energy is depleted. A voice whispers from the pool: 'When a traveler stumbles, what have they truly found?'",
    choices: [
      { text: '"Proof that I am not cut out for this journey."', correct: false },
      { text: '"An opportunity to reflect, adapt, and grow stronger."', correct: true },
      { text: '"A sign that the task is impossible."', correct: false }
    ],
    correctFeedback: "The water glows bright violet. A warm light fills your chest as you recover 1 Starlight Heart! 'You understand,' the voice says. 'Go forward, brave heart.'",
    wrongFeedback: "The water grows dark. The voice echoes: 'To reject growth is to stay in the shadow. Reflect once more.'"
  }
];

const ARROW = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>';
const STAR = '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.6 6.1 6.6.6-5 4.4 1.5 6.5L12 16.7 6.3 20.1l1.5-6.5-5-4.4 6.6-.6z"/></svg>';
const escapeHtml = s => s.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  const el = document.getElementById(id);
  el.scrollTop = 0;
}

function startJourney() {
  playSfx('click');
  const n = document.getElementById('hero-name').value.trim();
  heroName = n || 'Brave One';
  document.getElementById('name-greet').textContent = 'Welcome, ' + heroName;
  show('screen-chars');
  setScene('chars');
}

function selectChar(idx, el) {
  playSfx('click');
  selectedChar = idx;
  document.querySelectorAll('.char-card').forEach(card => card.setAttribute('aria-pressed', String(card === el)));
  document.getElementById('choose-btn').disabled = false;
}

function goToAdventure() {
  playSfx('click');
  currentChapter = 0; starsEarned = 0; lessonsLearned = []; starlightHearts = 3;
  renderChapter();
}

function getChapterChoices(chId) {
  const ch = chapters[chId];
  const chChoices = JSON.parse(JSON.stringify(ch.choices));
  const characterChoices = {
    0: { 0: '"Show her your climbing maps of the Silver Mountains, saying: \'Every fall is a lesson. "Not yet" is very different from "never".\'"', 1: '"Tell yourself: \'I\'ve prepared for this expedition. Nerves are just the excitement of a new trail—I can do this!\'"', 2: '"Look at the base you\'ve built! In my travels, I\'ve pitched tents in storms—every twig was a step. Let\'s figure out the next small step together."', 3: '"I have climbed too far and survived too many peaks to turn back now. I believe in myself, and I will restore the light!"' },
    1: { 0: '"Cast a gentle float spell to guide her wings, saying: \'Every fall teaches you something. "Not yet" is different from "never".\'"', 1: '"Tell yourself: \'Fear is just an equation to solve. I have prepared, I know my words, and making mistakes is human—I can do this.\'"', 2: '"Look at the structure! Let\'s arrange these twigs using stable geometry—every piece is a step. Let\'s figure out the next step together."', 3: '"My mind is clear, and my resolve is forged in study. I choose to restore the light!"' },
    2: { 0: '"Offer to practice flying with her, saying: \'I struggled to lead at first. Every fall teaches you something. "Not yet" is different from "never".\'"', 1: '"Tell yourself: \'True leadership means speaking from the heart. I have prepared, I am ready, and I can do this.\'"', 2: '"Look at your effort! A kingdom is built stone by stone—every twig is a step. Let\'s build the next part together."', 3: '"I stand for the hope of all my people. My determination is stronger than your dark whispers!"' },
    3: { 0: '"Leap clumsily to make her laugh, then say: \'Even fox spirits tumble! Every fall is a lesson, and "not yet" is different from "never".\'"', 1: '"Tell yourself: \'Laughter and stories are part of the dance. I have prepared, mistakes are just steps, and I can do this.\'"', 2: '"Look at the nest! Let\'s turn this into a game and search for the next branch together—every piece is a step."', 3: '"You cannot trick a clever spirit. I have come too far and played too many games to stop now. I believe in myself, and I will restore the light!"' }
  };
  const correctIdx = chChoices.findIndex(c => c.correct);
  if (correctIdx !== -1 && selectedChar !== null) chChoices[correctIdx].text = characterChoices[selectedChar][chId];
  return chChoices;
}

function heartsHtml() {
  let h = '';
  for (let i = 0; i < 3; i++) h += `<span class="heart${i < starlightHearts ? '' : ' lost'}">${STAR}</span>`;
  return h;
}

function updateHUD() {
  let dots = '';
  for (let i = 0; i < chapters.length; i++) dots += `<span class="dot${i < currentChapter ? ' done' : i === currentChapter ? ' now' : ''}"></span>`;
  document.getElementById('hud').innerHTML = `
    <div class="pill"><canvas class="mini" data-char="${selectedChar}" width="72" height="72" aria-hidden="true"></canvas><span class="who"><strong>${escapeHtml(heroName)}</strong><span>${charInfo[selectedChar].name}</span></span></div>
    <div class="pill plain" role="img" aria-label="Chapter ${currentChapter + 1} of ${chapters.length}"><span class="hud-label optional">Chapter ${currentChapter + 1} of ${chapters.length}</span><span class="dots">${dots}</span></div>
    <div class="pill plain" id="hearts-hud"><span class="hud-label optional">Hearts</span><span class="hearts" role="img" aria-label="${starlightHearts} of 3 Starlight Hearts">${heartsHtml()}</span></div>
    <div class="pill plain"><span class="hud-label">Wisdom</span><span style="font-family:var(--display);color:var(--gold)">${starsEarned}</span></div>`;
}

function renderChapter() {
  answered = false;
  const ch = chapters[currentChapter];
  const [tag, name] = ch.title.split(' — ');
  show('screen-adventure');
  setScene(ch.paintFn);
  updateHUD();
  const panel = document.getElementById('adv-panel');
  panel.classList.add('hidden');
  panel.innerHTML = `
    <p class="eyebrow">${tag}</p>
    <h2 class="display" tabindex="-1">${name}</h2>
    <p class="story-text">${ch.scene}</p>
    <div class="actions"><button class="btn" type="button" onclick="showChallenge()">Face the challenge ${ARROW}</button></div>`;
  const card = document.getElementById('title-card');
  card.innerHTML = `<span class="eyebrow">${tag}</span><span class="display">${name}</span><span class="tagline">${ch.caption}</span><span class="skip-hint">Tap to continue</span>`;
  card.classList.add('on');
  clearTimeout(titleTimer);
  titleTimer = setTimeout(endTitleCard, 3200);
}

function endTitleCard() {
  clearTimeout(titleTimer);
  const card = document.getElementById('title-card');
  if (!card.classList.contains('on')) return;
  card.classList.remove('on');
  const panel = document.getElementById('adv-panel');
  panel.classList.remove('hidden');
  panel.scrollTop = 0;
  const h = panel.querySelector('h2'); if (h) h.focus({ preventScroll: true });
}

function showChallenge() {
  playSfx('click');
  const ch = chapters[currentChapter];
  const choices = getChapterChoices(currentChapter);
  const panel = document.getElementById('adv-panel');
  panel.innerHTML = `
    <p class="eyebrow">Your challenge</p>
    <p class="challenge-q" tabindex="-1">${ch.challenge}</p>
    <div class="choices">${choices.map((c, i) => `<button class="choice-btn" type="button" onclick="answer(${i})">${c.text}</button>`).join('')}</div>
    <div id="feedback"></div>
    <div class="actions" id="next-wrap"></div>`;
  panel.scrollTop = 0;
  panel.querySelector('.challenge-q').focus({ preventScroll: true });
}

function answer(idx) {
  if (answered) return;
  answered = true;
  const ch = chapters[currentChapter];
  const choices = getChapterChoices(currentChapter);
  const correct = choices[idx].correct;
  const btns = document.querySelectorAll('#adv-panel .choice-btn');
  btns.forEach((b, i) => { b.disabled = true; if (choices[i].correct) b.classList.add('correct'); else if (i !== idx) b.classList.add('faded'); });
  if (!correct) btns[idx].classList.add('wrong');
  playSfx(correct ? 'correct' : 'wrong');
  if (correct) {
    starsEarned++; lessonsLearned.push(ch.lesson);
    scene.solved = true; sceneFx('correct');
  } else {
    starlightHearts--;
    if (!lessonsLearned.includes(ch.lesson)) lessonsLearned.push(ch.lesson);
    sceneFx('wrong');
  }
  updateHUD();
  if (!correct) { const hud = document.getElementById('hearts-hud'); hud.classList.add('shake'); setTimeout(() => hud.classList.remove('shake'), 600); }
  document.getElementById('feedback').innerHTML = `<div class="feedback ${correct ? 'correct' : 'wrong'}"><strong>${correct ? 'Well done!' : 'Hmm, not quite…'}</strong>${correct ? ch.correctFeedback : ch.wrongFeedback}<div class="lesson">${ch.lesson}</div></div>`;
  let label, action;
  if (starlightHearts <= 0) { label = 'Seek the Shrine of Resilience'; action = 'triggerShrine()'; }
  else { label = currentChapter + 1 < chapters.length ? 'Continue the journey' : 'Restore the Crystal'; action = 'nextChapter()'; }
  document.getElementById('next-wrap').innerHTML = `<button class="btn${starlightHearts <= 0 ? ' violet' : ''}" type="button" onclick="${action}">${label} ${ARROW}</button>`;
  const panel = document.getElementById('adv-panel');
  setTimeout(() => panel.scrollTo({ top: panel.scrollHeight, behavior: 'smooth' }), 100);
}

function triggerShrine() {
  playSfx('click');
  activeChapterBackup = currentChapter;
  show('screen-shrine');
  setScene('shrine');
  renderShrine();
}

function renderShrine() {
  const sq = shrineQuestions[0];
  document.getElementById('shrine-panel').innerHTML = `
    <p class="eyebrow" style="color:var(--shrine)">A place of reflection and strength</p>
    <h2 class="display" style="color:var(--shrine)" tabindex="-1">Shrine of Resilience</h2>
    <p class="story-text">Your energy has run low, but this is not the end. The Starlight Kingdom rewards those who see mistakes not as failure, but as lessons along the way.</p>
    <p class="eyebrow" style="color:var(--shrine)">The Shrine's question</p>
    <p class="challenge-q">${sq.q}</p>
    <div class="choices" id="shrine-choices">${sq.choices.map((c, i) => `<button class="choice-btn" type="button" onclick="answerShrine(${i})">${c.text}</button>`).join('')}</div>
    <div id="shrine-feedback"></div>
    <div class="actions" id="shrine-next"></div>`;
}

function answerShrine(idx) {
  const sq = shrineQuestions[0], correct = sq.choices[idx].correct;
  const btns = document.querySelectorAll('#shrine-choices .choice-btn');
  btns.forEach(b => b.disabled = true);
  btns[idx].classList.add(correct ? 'correct' : 'wrong');
  const fb = document.getElementById('shrine-feedback');
  const panel = document.getElementById('shrine-panel');
  if (correct) {
    starlightHearts = 1;
    playSfx('correct');
    scene.solved = true; sceneFx('violet');
    fb.innerHTML = `<div class="feedback correct"><strong>Resilience restored!</strong>${sq.correctFeedback}</div>`;
    document.getElementById('shrine-next').innerHTML = `<button class="btn violet" type="button" onclick="restoreHeartAndReturn()">Return to the adventure ${ARROW}</button>`;
    setTimeout(() => panel.scrollTo({ top: panel.scrollHeight, behavior: 'smooth' }), 100);
  } else {
    playSfx('wrong'); sceneFx('wrong');
    fb.innerHTML = `<div class="feedback wrong"><strong>Hmm… not quite.</strong>${sq.wrongFeedback}</div>`;
    setTimeout(() => { btns.forEach(b => { b.disabled = false; b.classList.remove('wrong'); }); fb.innerHTML = ''; }, 2000);
  }
}

function restoreHeartAndReturn() { playSfx('click'); currentChapter = activeChapterBackup; renderChapter(); }
function nextChapter() { playSfx('click'); currentChapter++; if (currentChapter >= chapters.length) showEnding(); else renderChapter(); }

function showEnding() {
  const char = charInfo[selectedChar], perfect = starsEarned === chapters.length;
  const title = char.name.split(' ').slice(1).join(' ');
  const praise = perfect
    ? `You answered every challenge wisely, ${escapeHtml(heroName)}. A true hero of heart and mind! The stars will remember your name.`
    : `Even the greatest heroes face setbacks, ${escapeHtml(heroName)}. What matters is that you kept going — and that wisdom is worth more than any star.`;
  document.getElementById('end-panel').innerHTML = `
    <p class="eyebrow">The stars shine bright once more</p>
    <h2 class="display glow-text" style="font-size:2rem" tabindex="-1">Quest Complete!</h2>
    <p class="story-text"><em>${escapeHtml(heroName)} the ${title}</em> has restored the Crystal of Courage to the heart of the Starlight Kingdom. Every star blazes anew, and the people of the land cheer your name. The kingdom is safe — because <em>you</em> believed, persevered, and never gave up.</p>
    <p class="eyebrow">Wisdom collected — ${starsEarned} of ${chapters.length} stars</p>
    <div class="lessons">${lessonsLearned.map(l => `<div class="lesson-pill">${l}</div>`).join('')}</div>
    <p class="story-text" style="font-style:italic;color:var(--gold)">${praise}</p>
    <div class="actions"><button class="btn" type="button" onclick="restartGame()">Play again ${ARROW}</button></div>`;
  show('screen-end');
  setScene('end');
}

function restartGame() {
  playSfx('click');
  heroName = ''; selectedChar = null; currentChapter = 0; starsEarned = 0; lessonsLearned = []; answered = false; starlightHearts = 3;
  document.getElementById('hero-name').value = '';
  document.querySelectorAll('.char-card').forEach(card => card.setAttribute('aria-pressed', 'false'));
  document.getElementById('choose-btn').disabled = true;
  show('screen-welcome');
  setScene('welcome');
}

document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') && document.getElementById('title-card').classList.contains('on')) { e.preventDefault(); endTitleCard(); }
});

renderSoundBtn();
resize();
requestAnimationFrame(frame);
</script>
